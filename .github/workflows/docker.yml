name: Docker

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # Built natively on each architecture: emulating the compiler is slow.
      - name: Build Docker image
        run: |
          docker build -t knot:latest .
          docker save knot:latest -o "knot-${{ matrix.arch }}.tar"

      # v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-image-${{ matrix.arch }}
          path: knot-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

  # Version tags go to the release registry (docker-oss), everything else
  # (PRs, master) goes to the nightly registry (docker-nightly). The
  # per-architecture images are combined into a single multi-arch manifest.
  #
  # The registry authenticates the workflow with a GitHub Actions OIDC token
  # (JWT). GitHub never grants id-token: write to pull requests from forks, so
  # the job is skipped for them.
  push:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      # Required for the runner to expose ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN.
      id-token: write
      contents: read
    steps:
      # Same as the `docker-gha-oidc` job option of famedly/engineering-standards.
      #
      # Instead of `docker login` or `podman login` (which write the token to
      # a config file), install a credential helper. Docker, podman, skopeo and
      # buildah invoke it on demand and it mints a fresh OIDC token each time,
      # so nothing is persisted and token expiry during long jobs is a non-issue.
      - name: Install OIDC credential helper for registry.famedly.net
        run: |
          set -euo pipefail

          bin="$RUNNER_TEMP/bin/docker-credential-gha-oidc"
          mkdir -p "$(dirname "$bin")"
          cat > "$bin" <<'EOF'
          #!/usr/bin/env bash
          # Docker credential helper, also understood by podman
          # https://github.com/docker/docker-credential-helpers#development
          set -euo pipefail
          if [[ "${1:-}" != get ]]; then
            echo "unsupported operation: ${1:-<none>}" >&2
            exit 1
          fi
          IFS= read -r server || [[ -n "$server" ]]
          curl -sSfG --data-urlencode "audience=https://$server" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" |
          jq --arg s "$server" \
            '{ServerURL: $s, Username: "__jwt", Secret: (.value // error("response has no .value"))}'
          EOF
          chmod +x "$bin"
          dirname "$bin" >> "$GITHUB_PATH"

          # Register the helper in a config file, keeping whatever else it holds.
          register() {
            mkdir -p "$(dirname "$1")"
            [ -s "$1" ] || echo '{}' > "$1"
            jq '.credHelpers["registry.famedly.net"] = "gha-oidc"' "$1" > "$1.tmp"
            mv "$1.tmp" "$1"
          }

          # Docker reads its config file.
          register "${DOCKER_CONFIG:-$HOME/.docker}/config.json"

          # The containers tools (podman, skopeo, buildah) read their auth file
          # (containers-auth.json(5)). If the job already points them at one,
          # add the helper there; otherwise create one.
          if [[ -n "${REGISTRY_AUTH_FILE:-}" ]]; then
            register "$REGISTRY_AUTH_FILE"
          else
            auth="$RUNNER_TEMP/containers-auth.json"
            register "$auth"
            echo "REGISTRY_AUTH_FILE=$auth" >> "$GITHUB_ENV"
          fi

      # v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: docker-image-*
          path: images
          merge-multiple: true

      - name: Push multi-arch Docker manifest to registry
        env:
          TAG: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            registry=registry.famedly.net/docker-oss
          else
            registry=registry.famedly.net/docker-nightly
          fi

          image="$registry/knot"
          # Branch names may contain slashes, which are not valid in Docker tags.
          tag="${TAG//\//-}"

          # Every `podman load` overwrites `knot:latest`, so retag each image
          # with an arch suffix before loading the next.
          podman manifest create knot-multiarch
          for arch in amd64 arm64; do
            podman load -i "images/knot-$arch.tar"
            podman tag knot:latest "knot:$arch"
            podman manifest add knot-multiarch "containers-storage:localhost/knot:$arch"
          done

          # `--all` pushes the per-arch images along with the manifest (by
          # digest only, so no arch-specific tags show up in the registry).
          # Publish under both the branch/tag name and the commit SHA.
          podman manifest push --all knot-multiarch "docker://$image:$tag"
          podman manifest push --all knot-multiarch "docker://$image:$GITHUB_SHA"
